[workspace]
authors = ["shivasankar <shivasankar.ka@gmail.com>"]
channels = [
    "https://conda.modular.com/max",
    "conda-forge",
    "https://conda.modular.com/max-nightly/",
    "https://repo.prefix.dev/modular-community",
]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[dependencies]
mojo = ">=1.0.0b1,<2"
# numojo = { git = "https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git", branch = "pre-0.10"}
numojo = { path = "../NuMojo"}

[feature.test.dependencies]
python = ">=3.13,<3.14"
scipy = ">=1.14"

[feature.test.tasks]
t = "clear && pixi run --environment test package && bash ./tests/test_all.sh"
test = "pixi run --environment test package && bash ./tests/test_all.sh"

[environments]
test = ["test"]

[tasks]
format = "mojo format ./scijo && mojo format ./tests && mojo format ./benchmark"
tests = "mojo package scijo && cp scijo.mojopkg tests/ && bash tests/test_all.sh"
package = "mojo package scijo && cp scijo.mojopkg tests/"
final = "pixi run format && mojo package scijo && cp scijo.mojopkg tests/ && bash tests/test_all.sh"
build = "mojo build"

[package]
name = "scijo"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*"}

[package.build.config.pkg]
name = "scijo"

[package.host-dependencies]
mojo = "==1.0.0b1"
# numojo = { git = "https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git", branch = "pre-0.10"}
numojo = { path = "../NuMojo"}

[package.build-dependencies]
mojo = "==1.0.0b1"
# numojo = { git = "https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git", branch = "pre-0.10"}
numojo = { path = "../NuMojo"}

[package.run-dependencies]
mojo = "==1.0.0b1"
# numojo = { git = "https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git", branch = "pre-0.10"}
numojo = { path = "../NuMojo"}
